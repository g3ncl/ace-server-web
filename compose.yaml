services:
  ace-server-web:
    build: .
    image: ace-server-web:local
    restart: unless-stopped
    network_mode: host
    environment:
      ACE_WEB_HOST: ${ACE_WEB_HOST:-127.0.0.1}
      PORT: ${WEB_PORT:-3000}
      ACE_WEB_USER: ${ACE_WEB_USER:-admin}
      ACE_WEB_PASSWORD: ${ACE_WEB_PASSWORD:-}
      ACE_AUTO_START: ${ACE_AUTO_START:-false}
    volumes:
      - ace-data:/data
    stop_grace_period: 20s
volumes:
  ace-data:
